# New API open-source Docker Compose example.
#
# Quick start:
#   docker compose up -d --build
#   open http://localhost:3000
#
# Production checklist:
#   - Change all example passwords and SESSION_SECRET.
#   - Configure HTTPS and reverse proxy on your server.
#   - Configure channels, payment gateways, trusted domains and docs link in admin settings.

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api:local
    container_name: new-api
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: postgresql://newapi:newapi_dev_password@postgres:5432/new-api
      REDIS_CONN_STRING: redis://redis:6379/0
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      SESSION_SECRET: change-this-session-secret
      # FRONTEND_BASE_URL: https://your-domain.example
      # TRUSTED_REDIRECT_DOMAINS: your-domain.example
      # STREAMING_TIMEOUT: "300"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\": true\\|\"success\":true'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: new-api-redis
    restart: unless-stopped
    networks:
      - new-api-network

  postgres:
    image: postgres:15-alpine
    container_name: new-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: newapi_dev_password
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:

networks:
  new-api-network:
    driver: bridge
